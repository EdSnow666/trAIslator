<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="面向英中、中英翻译教学的 Prompt 驱动型 CAT 演示工具">
  <title>Translation AIducator</title>
  <link rel="stylesheet" href="./styles/base.css?v=20260805-03">
  <link rel="stylesheet" href="./styles/layout.css?v=20260806-08">
  <link rel="stylesheet" href="./styles/components.css?v=20260806-07">
  <link rel="stylesheet" href="./styles/prompt-coach.css?v=20260804-01">
  <link rel="stylesheet" href="./styles/prompt-management.css?v=20260806-07">
  <link rel="stylesheet" href="./styles/ai-post-edit.css?v=20260804-01">
  <link rel="stylesheet" href="./styles/auth.css?v=20260804-02">
  <link rel="stylesheet" href="./styles/management.css?v=20260806-10">
  <link rel="stylesheet" href="./styles/project-resources.css?v=20260806-02">
  <link rel="stylesheet" href="./styles/bulk-actions.css?v=20260806-08">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">TA</div>
        <div class="brand-title">Translation AIducator</div>
      </div>

      <nav class="app-menu-bar" aria-label="应用菜单">
        <details class="menu-dropdown">
          <summary>项目</summary>
          <div class="menu-popover">
            <button id="import-button" class="menu-item">新建本地项目</button>
            <button id="project-management-button" class="menu-item" data-action="open-project-management" hidden>项目管理</button>
            <button id="personal-key-project" class="menu-item" data-action="open-personal-api-keys" hidden>个人 Key</button>
            <button id="brief-button" class="menu-item">任务书</button>
            <button class="menu-item" data-action="open-pair-import" data-import-kind="reference">上传参考译文</button>
            <span class="menu-divider"></span>
            <button id="export-button" class="menu-item">导出项目</button>
            <button class="menu-item" data-action="download-post-edit-json">导出全部译后编辑 JSON</button>
            <span class="menu-divider"></span>
            <button id="reset-button" class="menu-item danger-text">重置预存演示</button>
          </div>
        </details>
        <details class="menu-dropdown">
          <summary>翻译</summary>
          <div class="menu-popover">
            <button id="generate-current-button" class="menu-item">重译当前句</button>
            <button class="menu-item" data-action="ai-post-edit-current">用当前 Prompt AI 译后编辑当前句</button>
            <button id="generate-all-button" class="menu-item">用当前 Prompt 重译全文</button>
          </div>
        </details>
        <details class="menu-dropdown">
          <summary>Prompt</summary>
          <div class="menu-popover">
            <button class="menu-item" data-action="open-right-tab" data-tab="prompt">当前译文与 Prompt 详情</button>
            <button class="menu-item" data-action="open-prompt-lineage" data-prompt-kind="translation">查看 Prompt 谱系</button>
            <button class="menu-item" data-action="open-post-edit-task">译后编辑 Prompt</button>
            <button id="new-prompt-button" class="menu-item">新建 Prompt 版本</button>
            <button class="menu-item" data-action="generate-project-resource" data-resource="prompt">自动生成全文 Prompt</button>
            <button id="prompt-inspector-button" class="menu-item" data-action="open-prompt-inspector" hidden>后台 Prompt 发送结构</button>
          </div>
        </details>
        <details class="menu-dropdown">
          <summary>资源</summary>
          <div class="menu-popover">
            <button class="menu-item" data-action="open-resource-modal" data-tab="terms">项目术语库</button>
            <button class="menu-item" data-action="open-resource-modal" data-tab="tm">翻译记忆</button>
            <button class="menu-item" data-action="open-resource-modal" data-tab="mentor">AI Prompt 教练</button>
          </div>
        </details>
        <details id="management-menu" class="menu-dropdown" hidden>
          <summary>管理</summary>
          <div class="menu-popover">
            <button id="management-button" class="menu-item" data-action="open-management" hidden>教学管理</button>
            <button id="api-button" class="menu-item">模型与 API</button>
          </div>
        </details>
        <details class="menu-dropdown">
          <summary>显示</summary>
          <div class="menu-popover menu-popover-wide">
            <button id="compare-button" class="menu-item menu-toggle" aria-pressed="false">
              <span>查看全文 Diff</span><span class="menu-check">✓</span>
            </button>
            <button id="all-versions-button" class="menu-item menu-toggle" aria-pressed="false">
              <span>查看全部翻译版本</span><span class="menu-check">✓</span>
            </button>
            <button id="ai-post-edit-toggle" class="menu-item menu-toggle" data-action="toggle-ai-post-edit" aria-pressed="true">
              <span>隐藏 AI 译后编辑</span><span class="menu-check is-visible">✓</span>
            </button>
            <span class="menu-divider"></span>
            <button class="menu-item menu-toggle" data-action="toggle-pane" data-pane-target="left" aria-pressed="false">
              <span>左侧项目栏</span><span class="menu-check" data-pane-check="left">✓</span>
            </button>
            <button class="menu-item menu-toggle" data-action="toggle-pane" data-pane-target="right" aria-pressed="false">
              <span>右侧详情栏</span><span class="menu-check" data-pane-check="right">✓</span>
            </button>
            <span class="menu-divider"></span>
            <button class="menu-item" data-action="reset-layout">恢复默认显示</button>
          </div>
        </details>
      </nav>

      <div class="project-switcher">
        <label class="sr-only" for="project-select">当前项目</label>
        <select id="project-select" class="field field-compact"></select>
        <span id="project-origin-tag" class="badge badge-project-origin"></span>
        <span id="project-class-tags" class="project-class-tags"></span>
        <span id="direction-badge" class="badge badge-direction"></span>
      </div>

      <div class="top-actions">
        <label class="role-switcher">
          <span>演示身份</span>
          <select id="role-select" class="field field-compact">
            <option value="student">学生 · 当前学生</option>
            <option value="teacher">教师 · 林老师</option>
          </select>
        </label>
      </div>
    </header>

    <div class="workspace is-left-hidden is-right-hidden">
      <aside class="left-rail" data-pane="left" tabindex="0" aria-label="左侧项目栏"><div class="pane-zoom pane-left-content">
        <button class="pane-collapse-button pane-collapse-left" data-action="hide-pane" data-pane-target="left" aria-label="折叠左侧项目栏" title="折叠左侧项目栏">‹</button>
        <section class="rail-section project-card">
          <div class="eyebrow">CURRENT PROJECT</div>
          <h1 id="project-title"></h1>
          <p id="project-meta" class="muted"></p>
        </section>

        <section class="rail-section rail-segments-section">
          <div class="section-heading"><span>文档句段</span></div>
          <div class="segment-filter" role="group" aria-label="句段筛选">
            <button class="filter-chip is-active" data-filter="all">全部</button>
            <button class="filter-chip" data-filter="edited">已编辑</button>
            <button class="filter-chip" data-filter="translated">待确认</button>
          </div>
          <nav id="segment-nav" class="segment-nav" aria-label="句段导航"></nav>
        </section>

        <section class="rail-section rail-prompts-section">
          <div class="section-heading">
            <button class="section-heading-button" data-action="open-prompt-lineage">Prompt 谱系</button>
            <button id="prompt-lineage-all" class="text-button" data-action="open-prompt-lineage">查看全部</button>
          </div>
          <div id="prompt-kind-switch" class="prompt-face-switch" aria-label="翻译与译后编辑 Prompt 切换"></div>
          <div id="prompt-history" class="prompt-history" aria-label="Prompt 谱系"></div>
        </section>

        <section class="rail-footer"><span>本地演示 · 无后端</span></section>
      </div></aside>

      <div class="column-resizer" data-resizer="left" role="separator" aria-label="调整左栏宽度" aria-orientation="vertical" tabindex="0"></div>

      <main class="editor-pane" data-pane="center" tabindex="0" aria-label="中央编辑栏"><div class="pane-zoom pane-editor-content">
        <div class="editor-toolbar editor-toolbar-compact">
          <button class="pane-reopen-button pane-reopen-left" data-action="show-pane" data-pane-target="left" aria-label="显示左侧项目栏" title="显示左侧项目栏">›</button>
          <div class="toolbar-context">
            <span class="muted">当前使用</span>
          <button id="active-prompt-label" class="active-prompt-trigger" data-action="open-prompt-lineage" data-prompt-kind="translation" aria-label="查看当前 Prompt 谱系"></button>
            <button class="brief-toolbar-button" data-action="open-project-brief">任务书</button>
          </div>
          <button class="pane-reopen-button pane-reopen-right" data-action="show-pane" data-pane-target="right" aria-label="显示右侧详情栏" title="显示右侧详情栏">‹</button>
        </div>

        <div class="editor-scroll">
          <div class="column-head">
            <div>原文 SOURCE</div>
            <div class="target-column-heading"><span>译文 TARGET · 可直接译后编辑</span>
              <details class="menu-dropdown bulk-actions-dropdown">
                <summary class="brief-toolbar-button">一键操作</summary>
                <div class="bulk-actions-menu">
                  <button class="bulk-action-card is-translation" data-action="bulk-generate-all"><span class="bulk-action-icon">▤</span><span><strong>重译全文</strong><small>逐句生成并保存新版本</small></span></button>
                  <button class="bulk-action-card is-post-edit" data-action="bulk-post-edit-all"><span class="bulk-action-icon">✦</span><span><strong>译后编辑全文</strong><small>使用当前译后编辑 Prompt</small></span></button>
                  <button class="bulk-action-card is-confirm" data-action="bulk-confirm-all"><span class="bulk-action-icon">✓</span><span><strong>确认所有译文</strong><small>统一标记为已确认</small></span></button>
                  <button class="bulk-action-card is-submit" data-action="bulk-submit-all"><span class="bulk-action-icon">⇧</span><span><strong>提交所有译文</strong><small>发送给教师集中审阅</small></span></button>
                </div>
              </details></div>
            <div>状态</div>
          </div>
          <section id="segment-grid" class="segment-grid" aria-label="双语句段编辑器"></section>
        </div>
      </div></main>

      <div class="column-resizer" data-resizer="right" role="separator" aria-label="调整右栏宽度" aria-orientation="vertical" tabindex="0"></div>

      <aside class="right-panel" data-pane="right" tabindex="0" aria-label="右侧详情栏"><div class="pane-zoom pane-right-content">
        <div class="right-panel-header">
          <div class="right-tabs" role="tablist" aria-label="教学资源">
            <button class="right-tab is-active" data-tab="prompt" role="tab">当前译文</button>
            <button class="right-tab" data-tab="terms" role="tab">术语</button>
            <button class="right-tab" data-tab="tm" role="tab">TM</button>
            <button class="right-tab" data-tab="mentor" role="tab">AI 教练</button>
          </div>
          <button class="pane-collapse-button pane-collapse-right" data-action="hide-pane" data-pane-target="right" aria-label="折叠右侧详情栏" title="折叠右侧详情栏">›</button>
        </div>
        <div id="right-content" class="right-content"></div>
      </div></aside>
    </div>

    <footer class="statusbar">
      <span id="save-status">所有更改保存在本机</span>
      <span>左右栏可从栏内折叠，也可在编辑区上方重新显示</span>
      <span id="current-user-status"></span>
    </footer>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="./scripts/app.js?v=20260806-03"></script>
</body>
</html>
